name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install PyYAML capstone unicorn cmake ninja
      - name: Run the synthetic Python test suite
        run: python -m unittest discover -s tests

# Synthetic fixtures only: no game image, generated code or binaries are used or uploaded.
