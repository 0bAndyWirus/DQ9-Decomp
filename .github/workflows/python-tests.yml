name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

# Only superseded PR runs are cancelled; pushes and scheduled runs remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/python-tests.yml
      - name: Install dependencies
        run: python -m pip install PyYAML capstone unicorn cmake ninja
      - name: Run the synthetic Python test suite
        run: python -m unittest discover -s tests

# Synthetic fixtures only: no game image, generated code or binaries are used or uploaded.
