name: Windows runtime

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msvc:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install SDL2
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install sdl2:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch public SWI table oracle (not a Nintendo BIOS)
        run: |
          New-Item -ItemType Directory -Force reference/desmume-trace/source/src | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/TASEmulators/desmume/859d47e7ff99d0eef4adf318d8aa6fdc3afd3e5a/desmume/src/bios.cpp' -OutFile reference/desmume-trace/source/src/bios.cpp
      - name: Configure ROM-free runtime and tests
        run: |
          cmake -S . -B build/win-ci -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows -DDQ9_BUILD_SDL=ON -DDQ9_BUILD_GODOT=OFF `
            "-DDSR_SDL2_RUNTIME_DLL=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/SDL2.dll" `
            "-DDQ9_BIOS_REFERENCE_SOURCE=$PWD/reference/desmume-trace/source/src/bios.cpp"
      - name: Build
        run: |
          cmake --build build/win-ci -j 6
          if ($LASTEXITCODE -ne 0) {
            # Windows occasionally refuses to link a freshly written .exe ("Access is denied" / "file in use",
            # antivirus or indexer scanning it). One serial retry resumes where the build stopped; a real
            # compile or link error fails again and the job fails.
            Write-Host "Build failed; retrying once with a single job"
            cmake --build build/win-ci -j 1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run CTest
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build/win-ci --output-on-failure

  kit-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install kit build dependencies
        run: python -m pip install PyYAML capstone unicorn cmake ninja ziglang==0.16.0
      - name: Build and test ROM-free runtime with the kit toolchain
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SDL_RENDER_DRIVER: software
        run: python tools/build_port.py --runtime-only
      - name: Check real Windows launcher failure status and file paths
        run: |
          $kit = Join-Path $env:RUNNER_TEMP 'DQ9 kit ! launcher smoke'
          $tools = Join-Path $kit 'tools'
          $game = Join-Path $kit 'build/game/game'
          $abiDir = Join-Path $kit 'build/gen'
          New-Item -ItemType Directory -Force $tools, $game, $abiDir | Out-Null
          Set-Content -Encoding ascii (Join-Path $abiDir 'abi.ini') 'fixture'
          Copy-Item tools/windows/PLAY-DQ9.bat (Join-Path $kit 'PLAY-DQ9.bat')
          Copy-Item tools/build_port.py (Join-Path $tools 'build_port.py')
          $source = Join-Path $env:RUNNER_TEMP 'dq9-launcher-smoke.c'
          @'
          #include <stdio.h>
          #include <string.h>
          int main(int argc, char **argv) {
              const char *abi;
              int status;
              if (argc == 4 && strcmp(argv[1], "--launcher") == 0 &&
                  strcmp(argv[2], "--abi-config") == 0) {
                  abi = argv[3];
                  status = 7;
              } else if (argc == 7 && strcmp(argv[1], "--rom") == 0 &&
                         strcmp(argv[3], "--abi-config") == 0 &&
                         strcmp(argv[5], "--language") == 0 && strcmp(argv[6], "fr") == 0) {
                  FILE *input = fopen(argv[2], "rb");
                  if (!input) return 19;
                  int first = fgetc(input);
                  fclose(input);
                  if (first != 'f') return 20;
                  abi = argv[4];
                  status = 9;
              } else return 21;
              FILE *config = fopen(abi, "rb");
              if (!config) return 22;
              int first = fgetc(config);
              fclose(config);
              return first == 'f' ? status : 23;
          }
          '@ | Set-Content -Encoding ascii $source
          python -m ziglang cc $source -o (Join-Path $game 'dq9.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $play = Join-Path $kit 'PLAY-DQ9.bat'
          # An inherited RESULT=7 must not mask premature percent expansion in cmd.
          $env:RESULT = $null
          $PSNativeCommandUseErrorActionPreference = $false
          & $play
          $launcherExit = $LASTEXITCODE
          if ($launcherExit -ne 7) {
            throw "Launcher branch returned $launcherExit instead of 7"
          }

          # A text fixture proves the child can open the path containing spaces and !.
          $rom = Join-Path $kit 'input fixture !.txt'
          Set-Content -Encoding ascii $rom 'fixture'
          & $play $rom fr
          $directExit = $LASTEXITCODE
          if ($directExit -ne 9) {
            throw "Direct branch returned $directExit instead of 9 (path/ABI not preserved)"
          }
          # Both expected native failures were asserted; do not return their status to CI.
          exit 0
      - name: Audit source-only Windows kit
        run: python tools/package_windows_kit.py --tag ci

# This workflow builds and tests the host runtime only; it uploads nothing.
# A generated-game build requires a separately supplied generated-code directory.
# See docs/BUILDING_WINDOWS.md for local build configuration.
